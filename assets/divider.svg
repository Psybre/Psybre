      <stop offset="0%" stop-color="#00FF9F" stop-opacity="0"/>
      <stop offset="40%" stop-color="#00FF9F" stop-opacity=".55"/>
      <stop offset="60%" stop-color="#00E5FF" stop-opacity=".55"/>
